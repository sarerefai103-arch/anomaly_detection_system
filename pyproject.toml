[project]
name = "anomaly-detection-system"
version = "1.0.0"
description = "Smart data analytics: anomaly detection, business, predictive, drift, campaigns and chat."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",   # pycodestyle errors
    "F",                # pyflakes
    "W",                # pycodestyle warnings
    "I",                # isort
    "B",                # bugbear
    "C4",               # comprehensions
    "SIM",              # simplify
    "UP",               # pyupgrade
    "ARG",              # unused arguments
    "PERF",             # performance
    "RET",              # return style
    "ISC",              # implicit string concat
    "RUF",              # ruff-specific
    "S",                # bandit
    "PLW",              # pylint warnings
    "FURB",             # refurb
]
ignore = [
    "E501",     # أسطر طويلة: التسميات ثنائية اللغة (عربي | English) مقصودة
    "S603",     # subprocess بعملية Python داخلية موثوقة (ai_report / predictive)
    "S607",     # نفس السبب: sys.executable
    "S101",     # assert مستخدم في اختبارات المنطق
    "S110",     # try/except/pass مقصود عند إغلاق اتصالات قاعدة البيانات
]

allowed-confusables = [
    "–",  # en dash في النطاقات: 0.10–0.25
    "—",  # em dash كفاصل في النصوص المختلطة
    "×",  # علامة الضرب في "صف × عمود"
    "ℹ",  # أيقونة المعلومات في رسائل الواجهة
    "·",  # فاصل نقاط في التسميات
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "E402",     # sys.path bootstrap قبل استيراد وحدات التطبيق
]

[tool.ruff.lint.isort]
known-first-party = [
    "ai_report",
    "app_config",
    "business_analytics",
    "campaign_planner",
    "charts",
    "chat_with_data",
    "data_loader",
    "db_connector",
    "detection",
    "drift_monitor",
    "forecasting",
    "pdf_export",
    "predictive_analytics",
    "services",
    "sidebar",
    "ui",
    "views",
]
